name: CI

# Bei jedem Push: Kotlin übersetzen und Unit-Tests (Robolectric) laufen lassen.

on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Unit tests
        run: |
          echo releaseType=Debug > package.properties
          # LrcUtilsTest (Upstream, 34 Tests) scheitert in Robolectric an
          # IllegalAccessException (AndroidInterceptors.java:88), unabhängig von Squishy.
          ./gradlew :app:testDebugUnitTest \
            --tests 'org.akanework.gramophone.ThumbnailFallbackTest' \
            --tests 'org.akanework.gramophone.PauseableFlowsTest'

      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
